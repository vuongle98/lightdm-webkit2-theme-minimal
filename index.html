<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Login</title>
    <script type="text/javascript" src="js/main.js"></script>
    <link rel="stylesheet" type="text/css" href="css/main.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
  </head>

  <body id="body">
    <nav id="main_nav">
      <div class="nav-left"></div>

      <div class="nav-center">
        <span id="time">--:--</span>
      </div>

      <div class="nav-right">
        <div class="custom-select" id="custom-select-div">
          <select id="session-menu"></select>
        </div>
        <a href="javascript:lightdm.suspend();">suspend</a>
        <a href="javascript:lightdm.restart();">reboot</a>
        <a href="javascript:lightdm.shutdown();">shutdown</a>
      </div>
    </nav>

    <div id="main_content">
      <form id="login" onsubmit="handle_input()">
        <h1 id="pagetitle">Welcome back, vuog</h1>
        <img src="assets/avatar.png" alt="avatar" id="avatar" />

        <input
          type="text"
          id="username"
          value="vuongle"
          placeholder="username"
          class="form-field"
          required
        />

        <input
          type="password"
          id="password"
          placeholder="password"
          required
          class="form-field"
          autofocus
        />

        <div
          id="caps-lock-indicator"
          style="display: none"
          class="caps-lock-warning"
        >
          🔒 Caps Lock is ON
        </div>

        <button type="submit" value="login">log in</button>
      </form>
    </div>

    <div id="message-container"></div>

    <script>
      document.getElementById("login").addEventListener("submit", handle_input);
      document
        .getElementById("password")
        .addEventListener("keydown", handleCapsLock);
    </script>
  </body>
</html>
